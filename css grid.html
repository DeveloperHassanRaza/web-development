<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <link rel="stylesheet" href="grid.css">

    <!-- CSS External -->
     <style>
        .container{
            display: grid;
            grid-template-columns: 2fr 2fr 1fr;
            gap: 10px;
        }

        .box{
            background: steelblue;
            color: white;
            padding: 30px;
            font-size: 30px;
            text-align: center;
            border: 1px solid black;
        }
     </style>

</head>
<body>

    <!-- CSS GRID -->
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </div>
</body>
</html>
